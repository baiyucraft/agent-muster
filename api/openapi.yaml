openapi: 3.1.0
info:
  title: Agent Muster Hub
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: 检查 Hub 进程是否可以响应 HTTP 请求
      responses:
        '200':
          description: Hub 已响应
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/pairing-codes:
    post:
      operationId: createPairingCode
      summary: 为待配对的设备生成一个有效期为 10 分钟的一次性码
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/DeviceName' }
      responses:
        '201':
          description: 已生成配对码
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { $ref: '#/components/schemas/PairingCode' }
                  expires_at: { type: string, format: date-time }
        '400': { description: 无效的设备名称或请求体 }
        '401': { description: 管理员凭据缺失或无效 }
        '413': { description: 请求体超过 16 KiB }
        '415': { description: 请求的媒体类型须为 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: 列出已配对设备及其最近一次 Agent 探测结果
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: 设备清单，包括离线和已撤销设备
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { description: 管理员凭据缺失或无效 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/enroll:
    post:
      operationId: enrollDevice
      summary: 消费配对码并签发单台设备的凭据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, hostname, os, arch]
              properties:
                code: { $ref: '#/components/schemas/PairingCode' }
                hostname: { $ref: '#/components/schemas/DeviceName' }
                os: { $ref: '#/components/schemas/PlatformPart' }
                arch: { $ref: '#/components/schemas/PlatformPart' }
      responses:
        '201':
          description: 设备已登记，响应包含本次签发的令牌
          content:
            application/json:
              schema:
                type: object
                required: [device_id, token]
                properties:
                  device_id: { $ref: '#/components/schemas/DeviceID' }
                  token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        '400': { description: 配对码无效、过期或已使用，或者请求体无效 }
        '413': { description: 请求体超过 16 KiB }
        '415': { description: 请求的媒体类型须为 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    delete:
      operationId: revokeDevice
      summary: 撤销设备凭据并保留已登记的设备和清单
      security: [{ adminBearer: [] }]
      responses:
        '204': { description: 设备已撤销，重复撤销同一设备也返回成功 }
        '401': { description: 管理员凭据缺失或无效 }
        '404': { description: 设备 ID 无效或设备不存在 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    post:
      operationId: reportHeartbeat
      summary: 刷新该设备的最近在线时间
      security: [{ deviceBearer: [] }]
      responses:
        '204': { description: 心跳已保存 }
        '400': { description: 心跳请求体必须为空 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/inventory:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: reportInventory
      summary: 替换该设备的最近一次 CLI 清单
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agents]
              properties:
                agents: { $ref: '#/components/schemas/Agents' }
      responses:
        '204': { description: 清单已保存 }
        '400': { description: 无效的清单或请求体 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '413': { description: 请求体超过 16 KiB }
        '415': { description: 请求的媒体类型须为 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/device-updates:
    get:
      operationId: listDeviceUpdates
      summary: 查看设备端当前版本、指派版本和更新结果
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: 设备更新清单
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceUpdateState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/device-updates/{device_id}:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: assignDeviceUpdate
      summary: 为设备指派签名发布清单，离线设备上线后领取
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, manifest_url]
              properties:
                version: { $ref: '#/components/schemas/DeviceVersion' }
                manifest_url: { type: string, format: uri, maxLength: 2048 }
                retry: { type: boolean, description: 为失败或回滚的同版本重新创建指派 }
      responses:
        '200':
          description: 保存后的更新指派与状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceUpdateState' }
        '400': { description: 无效的设备 ID、目标版本或清单地址 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 设备不可用 }
        '409': { description: 设备正在切换版本，或请求与当前版本冲突 }
  /api/v1/devices/{device_id}/update/check:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    post:
      operationId: checkDeviceUpdate
      summary: 设备上报当前版本和更新进度并查询可执行的指派
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { $ref: '#/components/schemas/DeviceVersion' }
                report:
                  type: object
                  additionalProperties: false
                  required: [assignment_id, status]
                  properties:
                    assignment_id: { $ref: '#/components/schemas/DeviceUpdateID' }
                    status: { type: string, enum: [downloading, waiting, applying, succeeded, failed, rolled_back] }
                    error: { type: string, maxLength: 512 }
      responses:
        '200':
          description: 当前指派，空值表示没有可执行的更新
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target:
                    oneOf:
                      - $ref: '#/components/schemas/DeviceUpdateTarget'
                      - type: 'null'
        '400': { description: 无效的版本或状态 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
  /api/v1/workspace:
    get:
      operationId: getWorkspace
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: 主对话、任务、请示、项目、目录和同一事务视图的事件游标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/workspace/usage:
    get:
      operationId: getDeviceUsage
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: 按项目和执行设备汇总已结束的设备运行，并单列中心 dsh 已完成投递的用量与覆盖轮数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/events:
    get:
      operationId: streamWorkspace
      security: [{ adminBearer: [] }]
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: 按提交顺序发送 SSE，event 为 workspace，id 为游标，data 为 JSON 空对象。流到期后客户端用新游标重连。
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: 无效游标 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 游标超出可补读范围。重新请求工作台快照。 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/TaskID' }]
    get:
      operationId: getTask
      security: [{ adminBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 任务不存在 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/tasks/{id}/runs/{run_id}/logs:
    parameters:
      - $ref: '#/components/parameters/TaskID'
      - $ref: '#/components/parameters/RunLogRunID'
      - name: invocation
        in: query
        required: false
        schema: { $ref: '#/components/schemas/ReviewLogInvocation' }
    get:
      operationId: getRunLogs
      security: [{ adminBearer: [] }]
      description: 读取已领取且已退出运行的设备本地日志。Hub 等待回执最多 12 秒，正文仅转发给本次请求。
      responses:
        '200':
          description: 执行设备返回的读取状态或日志片段
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunLogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 此任务下没有指定运行 }
        '409': { description: 运行未领取或未退出，或执行设备已撤销 }
        '429': { description: Hub 已达到全局 32 条或单设备 4 条待处理读取请求 }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { description: 执行设备离线或未在时限内响应，包括尚未支持日志读取的设备 }
  /api/v1/tasks/{id}/control:
    parameters: [{ $ref: '#/components/parameters/TaskID' }]
    post:
      operationId: controlTask
      security: [{ adminBearer: [] }]
      requestBody:
        description: JSON 请求体不超过 16 KiB。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, request_id]
              properties:
                action: { $ref: '#/components/schemas/TaskControlAction' }
                request_id: { type: string, format: uuid, description: 同一次操作的重试须使用原 ID。 }
      responses:
        '200':
          description: 操作已登记，返回当前任务状态。同一任务以相同请求 ID 和操作重试时返回当前状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { description: 无效的任务 ID、操作或请求 ID }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 任务不存在 }
        '409': { description: 当前状态不可执行此操作，或同一请求 ID 已用于其他操作。 }
        '413': { description: 请求体超过大小上限 }
        '415': { description: 请求体须使用 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/approvals/{id}/answer:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ApprovalID' } }
    post:
      operationId: answerApproval
      security: [{ adminBearer: [] }]
      requestBody:
        description: JSON 请求体不超过 80 KiB。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answer]
              properties:
                answer: { type: string, minLength: 1, maxLength: 2000, description: 选项或自由文本。原文不超过 2000 UTF-8 字节，不含空字符，去除两端空白后须有内容。 }
      responses:
        '200':
          description: 已保存第一条有效答复并登记原会话续接。重复或并发提交返回已保存的答复和当前状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { description: 无效的请示 ID 或答复 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 请示不存在 }
        '409': { description: 请示的任务状态与续接条件冲突 }
        '413': { description: 请求体超过大小上限 }
        '415': { description: 请求体须使用 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveProject
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectBinding' }
      responses:
        '200':
          description: 已保存项目与目录绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { description: 无效的绑定 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 目录不存在或设备已撤销 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/conversation/messages:
    post:
      operationId: submitMessage
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, text]
              properties:
                id: { type: string, format: uuid }
                text: { type: string, minLength: 1, description: 不超过 6000 UTF-8 字节 }
                task_id: { $ref: '#/components/schemas/TaskID' }
      responses:
        '202':
          description: 消息已入库。相同 ID 和内容的重试返回原消息。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { description: 无效消息 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 追加要求关联的任务不存在 }
        '409': { description: 消息 ID 已存在且内容不同，或目标是组合根任务或正在取消的任务 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/directories:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: reportDirectories
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [directories]
              properties:
                directories:
                  type: array
                  maxItems: 32
                  items: { $ref: '#/components/schemas/Directory' }
      responses:
        '204': { description: 已替换设备目录清单 }
        '400': { description: 无效目录清单 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/run-log-requests:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    get:
      operationId: listRunLogRequests
      security: [{ deviceBearer: [] }]
      responses:
        '200':
          description: 当前设备待处理的读取请求。设备可以重复读取同一个请求，直到上传成功或管理员请求结束。
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/RunLogRequest' } }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/run-log-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - name: request_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/RunLogRequestID' }
    put:
      operationId: submitRunLogResponse
      security: [{ deviceBearer: [] }]
      requestBody:
        description: JSON 请求体上限 400 KiB，UTF-8 日志正文合计不超过 64 KiB。
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunLogResponse' }
      responses:
        '204': { description: Hub 已将回执交给等待读取的管理员请求 }
        '400': { description: 读取状态或日志片段无效 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 请求未知、已结束或属于其他设备。设备无需重试。 }
        '413': { description: JSON 请求体超过上限 }
        '415': { description: 请求类型须为 application/json }
        '429': { description: 同一请求已有回执上传在处理 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/claim:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    post:
      operationId: claimRun
      security: [{ deviceBearer: [] }]
      parameters:
        - name: Muster-Run-Control
          in: header
          description: 支持运行停止指令的设备发送值 1。
          schema: { type: string, enum: ['1'] }
        - name: Muster-Git-Verification
          in: header
          description: 支持候选验证的设备发送值 1。托管 Git 任务只派给声明支持的设备。
          schema: { type: string, enum: ['1'] }
        - name: Muster-Git-Publish
          in: header
          description: 支持独立审查、推送和回读的设备发送值 1，并同时声明支持停止指令和候选验证。
          schema: { type: string, enum: ['1'] }
        - name: Muster-Input-Receipt
          in: header
          description: 支持按输入 ID 提交处理回执的设备发送值 1。
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: 已领取运行。重复领取未结束的运行会返回原指令。完整 JSON 响应上限为 256 KiB，输入 ID 回执上限为 16 KiB。超限的首次领取会把该任务标为待核对并保留未处理输入，设备可继续领取其他任务。
          content:
            application/json:
              schema:
                type: object
                required: [id, task_id, directory_id, prompt, session_id]
                properties:
                  id: { $ref: '#/components/schemas/RunID' }
                  task_id: { $ref: '#/components/schemas/TaskID' }
                  directory_id: { $ref: '#/components/schemas/DirectoryID' }
                  prompt: { type: string }
                  input_ids:
                    description: 本轮需要设备确认处理的输入 ID。按领取请求协商能力后返回。
                    $ref: '#/components/schemas/RunInputIDs'
                  input_messages:
                    type: object
                    description: 续接带回的未处理消息，键为对应的 message 输入 ID。本轮新指令仍通过 prompt 提供。
                    propertyNames: { pattern: '^message:[A-Za-z0-9._-]{1,128}$' }
                    additionalProperties: { type: string }
                  session_id: { type: string, description: 首轮为空 }
                  approval_supported:
                    type: boolean
                    description: 为 true 时设备可提交请示回执。字段缺省视为未启用。
                  control_supported:
                    type: boolean
                    description: 为 true 时设备查询运行停止指令，并在停止后上报 stopped 事件。字段缺省视为未启用。
                  diagnostics_supported:
                    type: boolean
                    description: 为 true 时设备可随本轮终态上报诊断摘要。字段缺省视为未启用。
                  review_diagnostics_supported:
                    type: boolean
                    description: 为 true 时设备可随终态为独立 Review 上报候选、用量与设备日志引用。字段缺省视为未启用。
                  git_policy:
                    description: 托管 Git 任务首次派发时保存的交付规则快照。
                    $ref: '#/components/schemas/GitDeliveryPolicy'
                  git_publish: { type: boolean, description: 任务要求向冻结规则的目标推送并回读远端。 }
                  agent_kind: { $ref: '#/components/schemas/AgentKind' }
                  generation: { type: integer, format: int64, minimum: 1 }
                  lease: { $ref: '#/components/schemas/Lease' }
                  lease_until: { type: string, format: date-time }
                  project_id: { type: string, format: uuid }
                  binding_id: { type: string, format: uuid }
                  parent_task_id: { $ref: '#/components/schemas/TaskID' }
                  parent_device_id: { $ref: '#/components/schemas/DeviceID' }
                  root_task_id: { $ref: '#/components/schemas/TaskID' }
                  prompt_transfer_id: { $ref: '#/components/schemas/TransferID' }
                  attachments: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
                  delegation_targets:
                    type: array
                    maxItems: 64
                    description: 可用于设备协作的目标建议。领取响应空间不足时，Hub 可省略此字段。
                    items:
                      type: object
                      required: [project_id, project_name, binding_id, device_id, device_name, agent_kind, directory_label]
                      properties:
                        project_id: { type: string, format: uuid }
                        project_name: { type: string }
                        binding_id: { type: string, format: uuid }
                        device_id: { $ref: '#/components/schemas/DeviceID' }
                        device_name: { type: string }
                        agent_kind: { $ref: '#/components/schemas/AgentKind' }
                        directory_label: { type: string }
                  dependency_results:
                    type: array
                    items:
                      type: object
                      required: [task_id, status]
                      properties:
                        task_id: { $ref: '#/components/schemas/TaskID' }
                        status: { type: string }
        '204': { description: 轮询期间没有待执行的运行 }
        '400': { description: 请求体必须为空 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/control:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RunID' } }
    post:
      operationId: getRunControl
      security: [{ deviceBearer: [] }]
      requestBody:
        description: JSON 请求体不超过 16 KiB。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease]
              properties:
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
      responses:
        '200':
          description: 返回当前运行是否应停止。查询不会消费指令。
          content:
            application/json:
              schema:
                type: object
                required: [stop]
                properties:
                  stop: { type: boolean }
        '400': { description: 无效的运行 ID、运行代次或租约 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 运行不属于该设备 }
        '409': { description: 运行代次或租约与当前记录不匹配 }
        '413': { description: 请求体超过大小上限 }
        '415': { description: 请求体须使用 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/events/{sequence}:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RunID' } }
      - { name: sequence, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: recordRunEvent
      security: [{ deviceBearer: [] }]
      requestBody:
        description: JSON 请求体不超过 256 KiB。请示与停止事件须携带当前运行代次和租约。停止事件须在确认本轮进程树退出后上报。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [started, session, waiting, approval_requested, stopped, completed, failed, interrupted] }
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                session_id: { type: string, description: session 事件必填 }
                text: { type: string, description: 根任务汇报摘要。不超过 12000 UTF-8 字节。 }
                wait_for_task_ids: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/TaskID' } }
                transfer_ids: { $ref: '#/components/schemas/TransferIDs' }
                approval:
                  description: approval_requested 事件必填。需要已知的原生会话，与等待任务和投递字段互斥。
                  $ref: '#/components/schemas/ApprovalRequest'
                diagnostics:
                  description: 本轮退出时设备采集的诊断摘要。started 与 session 事件不接受此字段。
                  $ref: '#/components/schemas/RunDiagnostics'
                git_verification:
                  description: 托管 Git 任务的验证结果。completed 事件须提供已通过的回执。
                  $ref: '#/components/schemas/GitVerification'
                input_receipt:
                  description: 支持输入回执的轮次可提交此字段。本轮有待确认输入时，completed 必须覆盖领取的全部输入 ID。waiting、approval_requested、failed 和 interrupted 可确认部分输入。
                  $ref: '#/components/schemas/InputReceipt'
              allOf:
                - if: { properties: { kind: { enum: [started, session, stopped] } } }
                  then: { not: { required: [input_receipt] } }
      responses:
        '204': { description: 事件已保存或已确认过相同内容 }
        '400': { description: 无效的事件、序号、运行诊断、输入回执或 Git 验证回执 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 设备未领取该运行 }
        '409': { description: 事件序号、内容、原生会话、请示或运行控制状态发生冲突 }
        '413': { description: 请求体超过大小上限 }
        '415': { description: 请求体须使用 application/json }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/peer:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: registerDevicePeer
      summary: 登记设备的私网 HTTPS 地址和证书公钥指纹
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, fingerprint]
              properties:
                address: { type: string, format: uri, description: 包含 IP 和端口的私网 HTTPS origin }
                fingerprint: { $ref: '#/components/schemas/SHA256' }
      responses:
        '204': { description: 已登记 }
        '400': { description: 无效的私网地址或指纹 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/rtc:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: registerDeviceRTC
      summary: 登记自动连接能力并获取 ICE 配置
      security: [{ deviceBearer: [] }]
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                required: [ice_servers]
                properties:
                  ice_servers:
                    type: array
                    items:
                      type: object
                      required: [urls]
                      properties:
                        urls: { type: array, items: { type: string } }
                        username: { type: string }
                        credential: { type: string }
                  diagnostic_transfer_id: { $ref: '#/components/schemas/TransferID' }
                  diagnostic_port_mapping: { type: boolean, description: 仅对指定诊断投递尝试临时 IPv4 UDP 映射 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/rtc/public-key:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    put:
      operationId: reportDeviceRTCPublicKey
      summary: 声明指定验收设备的信令签名公钥
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key: { type: string, pattern: '^[A-Za-z0-9+/]{43}=$', description: Base64 编码的 Ed25519 公钥 }
      responses:
        '204': { description: 已记录首次公钥或已存在相同公钥 }
        '400': { description: 无效的 Ed25519 公钥 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 登记入口关闭或设备不属于指定验收投递 }
        '409': { description: 设备已登记不同的公钥 }
        '413': { description: 请求体超过 128 字节 }
        '415': { description: 请求的媒体类型须为 application/json }
  /api/v1/devices/{device_id}/rtc/offers:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    get:
      operationId: listDeviceRTCOffers
      summary: 查看发往该设备的待接收连接描述
      security: [{ deviceBearer: [] }]
      responses:
        '200':
          description: 该设备有权接收的短时连接描述
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers:
                    type: array
                    maxItems: 4
                    items:
                      allOf:
                        - $ref: '#/components/schemas/RTCSignal'
                        - type: object
                          required: [transfer_id]
                          properties:
                            transfer_id: { $ref: '#/components/schemas/TransferID' }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
  /api/v1/devices/{device_id}/rtc/{transfer_id}/offer:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - $ref: '#/components/parameters/TransferID'
    put:
      operationId: putDeviceRTCOffer
      summary: 发送方为已授权交接发布 WebRTC 连接描述
      security: [{ deviceBearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/RTCSignal' }
      responses:
        '204': { description: 描述已保存 }
        '400': { description: 无效的交接 ID、尝试 ID 或 SDP }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 交接不可用 }
        '409': { description: 同一尝试的描述与保存值冲突 }
  /api/v1/devices/{device_id}/rtc/{transfer_id}/answer:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - $ref: '#/components/parameters/TransferID'
    get:
      operationId: getDeviceRTCAnswer
      summary: 发送方查看本次连接尝试的应答
      security: [{ deviceBearer: [] }]
      parameters:
        - name: attempt_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RTCAttemptID' }
      responses:
        '200':
          description: 应答为空字符串时仍在等待接收方
          content:
            application/json:
              schema:
                type: object
                required: [sdp]
                properties:
                  sdp: { type: string, maxLength: 12288 }
        '400': { description: 无效的交接 ID 或尝试 ID }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 尝试不可用 }
    put:
      operationId: putDeviceRTCAnswer
      summary: 接收方发布连接应答
      security: [{ deviceBearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/RTCSignal' }
      responses:
        '204': { description: 应答已保存 }
        '400': { description: 无效的交接 ID、尝试 ID 或 SDP }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 尝试不可用 }
        '409': { description: 同一尝试的应答与保存值冲突 }
  /api/v1/devices/{device_id}/rtc/{transfer_id}/diagnostic:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - $ref: '#/components/parameters/TransferID'
    put:
      operationId: reportDeviceRTCDiagnostic
      summary: 上报已启用验收投递的当前连接尝试
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, stage]
              properties:
                attempt_id: { $ref: '#/components/schemas/RTCAttemptID' }
                stage: { enum: [wait_answer, apply_answer, answer, wait_stream, stream, complete] }
                ice_state: { enum: [new, checking, connected, completed, disconnected, failed, closed] }
                dtls_state: { enum: [new, connecting, connected, failed, closed] }
                ipv6_global: { type: boolean }
                ipv6_default_route: { type: boolean }
                ipv4_mapping: { enum: [endpoint_dependent, consistent, inconclusive] }
                gateway_mapping: { enum: [global, private, unsupported, timeout, unavailable] }
                local_ipv4_host: { type: integer, minimum: 0, maximum: 32 }
                local_ipv4_reflexive: { type: integer, minimum: 0, maximum: 32 }
                local_ipv6_host: { type: integer, minimum: 0, maximum: 32 }
                local_ipv6_reflexive: { type: integer, minimum: 0, maximum: 32 }
                requests_sent: { type: integer, minimum: 0, maximum: 1000000 }
                requests_received: { type: integer, minimum: 0, maximum: 1000000 }
                responses_sent: { type: integer, minimum: 0, maximum: 1000000 }
                responses_received: { type: integer, minimum: 0, maximum: 1000000 }
                selected_pair: { enum: [ipv4_direct, ipv6_direct, relay] }
      responses:
        '204': { description: 诊断已记录 }
        '400': { description: 诊断字段或连接尝试无效 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 诊断未启用或该设备无适用的连接尝试 }
        '413': { description: 请求体超过 2048 字节 }
        '415': { description: 请求的媒体类型须为 application/json }
  /api/v1/devices/{device_id}/runs/{id}/lease:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/RunID' }
    put:
      operationId: renewRunLease
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunLease' }
      responses:
        '200':
          description: 已延长当前轮次租约
          content:
            application/json:
              schema:
                type: object
                required: [lease_until]
                properties:
                  lease_until: { type: string, format: date-time }
        '400': { description: 无效的运行或租约 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '409': { description: 运行租约已变化 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/wait/validate:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/RunID' }
    post:
      operationId: validateRunWait
      summary: 在设备登记等待意图前检查轮次租约和依赖范围
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease]
              anyOf:
                - required: [wait_for_task_ids]
                - required: [transfer_ids]
              properties:
                kind: { type: string, const: waiting }
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                wait_for_task_ids: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/TaskID' } }
                transfer_ids: { $ref: '#/components/schemas/TransferIDs' }
      responses:
        '204': { description: 等待条件属于当前轮次，轮次结束后方可提交 }
        '400': { description: 无效的等待请求 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 未找到当前设备的轮次 }
        '409': { description: 租约过期，或依赖超出当前轮次的范围 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/git-push:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - $ref: '#/components/parameters/RunID'
    post:
      operationId: authorizeGitPush
      security: [{ deviceBearer: [] }]
      requestBody:
        description: JSON 请求体不超过 80 KiB。
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease, verification, destination_fingerprint]
              properties:
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                verification: { $ref: '#/components/schemas/GitVerification' }
                destination_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$', description: 设备为实际推送地址计算的指纹。 }
                input_receipt:
                  description: 支持输入回执的轮次存在待确认输入时，须覆盖领取的全部输入 ID，方可申请推送授权。
                  $ref: '#/components/schemas/InputReceipt'
      responses:
        '200':
          description: 已保存或重放同一推送意图。仅 push_allowed 为 true 时可发起推送。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitPushIntent' }
        '400': { description: 推送请求、输入回执或验证证据无效 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 设备未领取该运行 }
        '409': { description: 运行状态、控制指令、追加输入或意图内容冲突 }
        '413': { description: 请求体超过大小上限 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/git-push/{intent_id}/observation:
    parameters:
      - $ref: '#/components/parameters/DeviceID'
      - $ref: '#/components/parameters/RunID'
      - name: intent_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/GitPushIntentID' }
    put:
      operationId: observeGitPush
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease, status]
              properties:
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                status: { type: string, enum: [same_commit, contains_commit, missing, diverged, unavailable] }
                observed_oid: { $ref: '#/components/schemas/GitCommitOID' }
      responses:
        '200':
          description: 已保存或重放该意图的回读结果，push_allowed 恒为 false。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitPushIntent' }
        '400': { description: 无效的回读结果 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 设备未领取该运行或推送意图不存在 }
        '409': { description: 意图或运行凭据不匹配 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/children:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/RunID' }
    post:
      operationId: delegateChildTask
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease, request_key, project_id, binding_id, title, prompt_transfer_id]
              properties:
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                request_key: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
                task_id: { $ref: '#/components/schemas/TaskID' }
                project_id: { type: string, format: uuid }
                binding_id: { type: string, format: uuid }
                title: { type: string, description: 不超过 240 UTF-8 字节 }
                prompt_transfer_id: { $ref: '#/components/schemas/TransferID' }
                transfer_ids: { $ref: '#/components/schemas/TransferIDs' }
      responses:
        '202':
          description: 已登记子任务，或返回同请求已有的子任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { description: 无效的子任务请求 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 绑定、轮次或投递不存在 }
        '409': { description: 当前轮次、绑定、投递或幂等键冲突 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/runs/{id}/transfers:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/RunID' }
    post:
      operationId: createDeviceTransfer
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, lease, id, target_device_id, name, kind, sha256, size]
              properties:
                generation: { type: integer, format: int64, minimum: 1 }
                lease: { $ref: '#/components/schemas/Lease' }
                id: { $ref: '#/components/schemas/TransferID' }
                target_device_id: { $ref: '#/components/schemas/DeviceID' }
                name: { type: string, minLength: 1, maxLength: 255 }
                kind: { $ref: '#/components/schemas/TransferKind' }
                sha256: { $ref: '#/components/schemas/SHA256' }
                size: { type: integer, format: int64, minimum: 0, maximum: 33554432, description: message 类型最多 65536 字节 }
      responses:
        '201': { $ref: '#/components/responses/Transfer' }
        '400': { description: 无效的投递元数据 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 轮次或目标设备不存在 }
        '409': { description: 轮次或投递内容冲突 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/transfers/outgoing:
    parameters: [{ $ref: '#/components/parameters/DeviceID' }]
    get:
      operationId: listOutgoingDeviceTransfers
      security: [{ deviceBearer: [] }]
      responses:
        '200':
          description: 本设备待交付的投递清单
          content:
            application/json:
              schema:
                type: object
                required: [transfers]
                properties:
                  transfers: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/transfers/{transfer_id}/authorize:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/TransferID' }
    post:
      operationId: authorizeDeviceTransfer
      summary: 为当前发送方签发 10 分钟投递授权
      security: [{ deviceBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Transfer' }
        '400': { description: 无效的投递 ID 或请求体 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 投递不存在 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/transfers/{transfer_id}/error:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/TransferID' }
    put:
      operationId: reportDeviceTransferError
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [peer_unavailable, verification_failed, delivery_failed] }
      responses:
        '204': { description: 已记录发送方的交接失败类别 }
        '400': { description: 无效的投递 ID 或错误类别 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 投递不存在 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/transfers/{transfer_id}/verify:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/TransferID' }
    post:
      operationId: verifyDeviceTransfer
      security: [{ deviceBearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/TransferTicket' }
      responses:
        '200': { $ref: '#/components/responses/Transfer' }
        '400': { description: 无效的投递 ID 或授权格式 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 投递不存在 }
        '409': { description: 授权失效或内容冲突 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/devices/{device_id}/transfers/{transfer_id}/ack:
    parameters:
      - { $ref: '#/components/parameters/DeviceID' }
      - { $ref: '#/components/parameters/TransferID' }
    put:
      operationId: acknowledgeDeviceTransfer
      security: [{ deviceBearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/TransferTicket' }
      responses:
        '204': { description: 已确认落盘或已收到相同确认 }
        '400': { description: 无效的投递 ID 或授权格式 }
        '401': { $ref: '#/components/responses/DeviceUnauthorized' }
        '404': { description: 投递不存在 }
        '409': { description: 授权失效或内容冲突 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/projects:
    get:
      operationId: listPluginProjects
      security: [{ pluginBearer: [] }]
      responses:
        '200':
          description: 具有有效设备目录绑定的项目
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/TaskID' }]
    get:
      operationId: getPluginTask
      security: [{ pluginBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 任务不存在 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/deliveries/claim:
    post:
      operationId: claimDelivery
      security: [{ pluginBearer: [] }]
      responses:
        '200':
          description: 已领取消息或汇报。领取有效期为 60 秒。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '204': { description: 暂无投递或当前主会话已有在途投递 }
        '400': { description: 请求体必须为空 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/deliveries/{id}/lease:
    parameters: [{ $ref: '#/components/parameters/DeliveryID' }]
    put:
      operationId: renewDelivery
      security: [{ pluginBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease]
              properties:
                lease: { $ref: '#/components/schemas/Lease' }
      responses:
        '204': { description: 有效期已延长 }
        '400': { description: 无效的投递 ID 或领取标识 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 领取已过期或交付已处理 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/deliveries/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/DeliveryID' }]
    put:
      operationId: completeDelivery
      security: [{ pluginBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease, text, status]
              properties:
                lease: { $ref: '#/components/schemas/Lease' }
                text: { type: string, description: 不超过 12000 UTF-8 字节 }
                status: { type: string, enum: [handled, interrupted] }
                usage: { $ref: '#/components/schemas/CenterTurnUsage' }
      responses:
        '204': { description: 已保存结果。未完成的汇报稍后重试。 }
        '400': { description: 无效的结果 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 投递不存在 }
        '409': { description: 领取已过期或结果冲突 }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/plugin/deliveries/{id}/dispatch:
    parameters: [{ $ref: '#/components/parameters/DeliveryID' }]
    post:
      operationId: dispatchTask
      security: [{ pluginBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease]
              description: >-
                单项派发提供 project_id、title 和 prompt。续接普通根任务提供 task_id 和 prompt。
                组合派发提供 title 和 steps，一次提交完整计划。任务与绑定在同一事务内冻结。
                同一消息以原计划重试时返回已有根任务 ID，计划内容冲突时返回 409。
                请求体上限为 320 KiB。
              oneOf:
                - required: [project_id, title, prompt]
                  if:
                    required: [git_publish]
                    properties:
                      git_publish: { const: true }
                  then:
                    required: [git_delivery]
                    properties:
                      git_delivery: { const: true }
                  not:
                    anyOf:
                      - required: [task_id]
                      - required: [steps]
                - required: [task_id, prompt]
                  properties:
                    git_delivery: { const: false }
                    git_publish: { const: false }
                  not:
                    anyOf:
                      - required: [project_id]
                      - required: [binding_id]
                      - required: [steps]
                - required: [title, steps]
                  properties:
                    git_delivery: { const: false }
                    git_publish: { const: false }
                  not:
                    anyOf:
                      - required: [project_id]
                      - required: [binding_id]
                      - required: [task_id]
                      - required: [prompt]
              properties:
                lease: { $ref: '#/components/schemas/Lease' }
                project_id: { type: string, format: uuid }
                binding_id: { type: string, format: uuid, description: 新建任务时选用的绑定，缺省取项目默认值 }
                git_delivery:
                  type: boolean
                  description: 仅在新建任务时生效。为 true 时冻结项目配置的 Git 交付规则。
                git_publish:
                  type: boolean
                  description: 新建任务明确要求推送时使用。为 true 时 git_delivery 也须为 true。
                task_id: { $ref: '#/components/schemas/TaskID' }
                title: { type: string, description: 不超过 240 UTF-8 字节 }
                prompt: { type: string, description: 不超过 6000 UTF-8 字节 }
                steps:
                  type: array
                  minItems: 2
                  maxItems: 8
                  description: 常规设备工作。前置步骤全部完成后才允许领取有依赖的步骤。
                  items: { $ref: '#/components/schemas/DispatchStep' }
      responses:
        '200':
          description: 已派发任务或返回该来源消息的已有任务 ID
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                properties:
                  task_id: { $ref: '#/components/schemas/TaskID' }
        '400': { description: 无效的派发请求 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 投递或续接任务不存在 }
        '409': { description: 领取、项目绑定、项目 Git 规则、已保存计划或任务续接状态冲突 }
        '413': { description: 请求体超过 320 KiB }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Hub 配置的管理员令牌
    deviceBearer:
      type: http
      scheme: bearer
      description: 配对时签发且只适用于此设备的令牌
    pluginBearer:
      type: http
      scheme: bearer
      description: Go Hub 和中心 dsh 共用的独立插件令牌
  parameters:
    RunLogRunID:
      name: run_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RunLogRunID' }
    DeviceID:
      name: device_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DeviceID' }
    TaskID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TaskID' }
    RunID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RunID' }
    TransferID:
      name: transfer_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TransferID' }
    DeliveryID:
      name: id
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    RTCSignal:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RTCSignal' }
    TransferTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ticket]
            properties:
              ticket: { $ref: '#/components/schemas/SHA256' }
  responses:
    Unauthorized:
      description: 请求凭据缺失或无效
    TaskDetail:
      description: 任务、运行轮次和关联消息
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskDetail' }
    DeviceUnauthorized:
      description: 未识别设备，或凭据缺失、不匹配、已撤销
    Unavailable:
      description: 接口尚未启用或 Hub 无法访问数据库
    Transfer:
      description: 投递元数据。发送方获得目标端点和短期授权。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Transfer' }
  schemas:
    DeviceVersion:
      type: string
      pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
    DeviceUpdateID:
      type: string
      pattern: '^upd-[a-f0-9]{32}$'
    DeviceUpdateTarget:
      type: object
      required: [id, version, manifest_url, assigned_at]
      properties:
        id: { $ref: '#/components/schemas/DeviceUpdateID' }
        version: { $ref: '#/components/schemas/DeviceVersion' }
        manifest_url: { type: string, format: uri, maxLength: 2048 }
        assigned_at: { type: string, format: date-time }
    DeviceUpdateState:
      type: object
      required: [device_id, current_version, target, status]
      properties:
        device_id: { $ref: '#/components/schemas/DeviceID' }
        current_version:
          oneOf:
            - $ref: '#/components/schemas/DeviceVersion'
            - const: ''
        target:
          oneOf:
            - $ref: '#/components/schemas/DeviceUpdateTarget'
            - type: 'null'
        status: { type: string, enum: [idle, pending, downloading, waiting, applying, succeeded, failed, rolled_back] }
        error: { type: string }
        reported_at: { type: string, format: date-time }
    RTCAttemptID:
      type: string
      pattern: '^[a-f0-9]{32}$'
    RTCSignal:
      type: object
      required: [attempt_id, sdp]
      properties:
        attempt_id: { $ref: '#/components/schemas/RTCAttemptID' }
        sdp: { type: string, maxLength: 12288, description: WebRTC DataChannel 的连接元数据 }
    DirectoryID: { type: string, pattern: '^dir-[0-9a-f]{32}$' }
    TaskID: { type: string, pattern: '^task-[0-9a-f-]{36}$' }
    RunID: { type: string, pattern: '^run-[0-9a-f-]{36}$' }
    Lease: { type: string, pattern: '^[A-Z2-7]{26}$' }
    AgentKind: { type: string, enum: [dsh, codex] }
    DispatchStep:
      type: object
      additionalProperties: false
      required: [project_id, title, prompt]
      properties:
        project_id: { type: string, format: uuid }
        binding_id: { type: string, format: uuid, description: 缺省取项目默认绑定。 }
        title: { type: string, description: 不超过 240 UTF-8 字节 }
        prompt: { type: string, description: 不超过 6000 UTF-8 字节 }
        depends_on:
          type: array
          uniqueItems: true
          maxItems: 7
          description: 前置步骤在同一计划中的位置，从 1 开始，只可引用排在本步骤前面的步骤。
          items: { type: integer, minimum: 1, maximum: 7 }
    SHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
    TransferID: { type: string, pattern: '^transfer-[0-9a-f-]{36}$' }
    TransferIDs:
      type: array
      maxItems: 32
      uniqueItems: true
      items: { $ref: '#/components/schemas/TransferID' }
    RunInputIDs:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: '^(message|transfer):[A-Za-z0-9._-]{1,128}$'
    InputReceipt:
      type: object
      additionalProperties: false
      description: 设备领取时确保完整的输入回执 JSON 不超过 16 KiB。
      required: [handled_input_ids]
      properties:
        handled_input_ids:
          description: 本轮实际处理过的输入 ID。每个 ID 都必须属于本轮领取的输入集合。
          $ref: '#/components/schemas/RunInputIDs'
    TransferKind: { type: string, enum: [prompt, file, message, result] }
    RunLease:
      type: object
      additionalProperties: false
      required: [generation, lease]
      properties:
        generation: { type: integer, format: int64, minimum: 1 }
        lease: { $ref: '#/components/schemas/Lease' }
    Peer:
      type: object
      required: [device_id, address, fingerprint]
      properties:
        device_id: { $ref: '#/components/schemas/DeviceID' }
        address: { type: string, format: uri }
        fingerprint: { $ref: '#/components/schemas/SHA256' }
    Transfer:
      type: object
      required: [id, run_id, task_id, source_device_id, target_device_id, name, kind, sha256, size]
      properties:
        id: { $ref: '#/components/schemas/TransferID' }
        run_id: { $ref: '#/components/schemas/RunID' }
        task_id: { $ref: '#/components/schemas/TaskID' }
        source_device_id: { $ref: '#/components/schemas/DeviceID' }
        target_device_id: { $ref: '#/components/schemas/DeviceID' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/TransferKind' }
        sha256: { $ref: '#/components/schemas/SHA256' }
        size: { type: integer, format: int64, minimum: 0, maximum: 33554432 }
        status: { type: string }
        attempts: { type: integer, minimum: 0 }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ticket: { $ref: '#/components/schemas/SHA256' }
        peer: { $ref: '#/components/schemas/Peer' }
    Dependency:
      type: object
      required: [task_id, depends_on_task_id, generation, status, active]
      properties:
        task_id: { $ref: '#/components/schemas/TaskID' }
        depends_on_task_id: { $ref: '#/components/schemas/TaskID' }
        generation: { type: integer, format: int64, minimum: 1 }
        status: { type: string }
        active: { type: boolean }
    TaskInput:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { type: string, description: 请示答复使用关联的请示 ID。 }
        kind: { type: string, enum: [message, delegation, dependency, execution, approval, transfer] }
        status: { type: string }
        created_at: { type: string, format: date-time }
        message_id: { type: string }
        run_id: { $ref: '#/components/schemas/RunID' }
        generation: { type: integer, format: int64, minimum: 1 }
        claimed_at: { type: string, format: date-time }
        transfer_ids: { type: array, items: { $ref: '#/components/schemas/TransferID' } }
        receipt_status: { type: string, enum: [awaiting_delivery, delivered, handled, needs_review], description: Hub 确认的输入处理进度。 }
        receipt_run_id: { $ref: '#/components/schemas/RunID' }
        handled_at: { type: string, format: date-time, description: Hub 确认输入已处理的时间。 }
      allOf:
        - if: { properties: { kind: { const: transfer } } }
          then:
            required: [transfer_ids]
            properties:
              transfer_ids: { minItems: 1, maxItems: 1 }
    WaitedTransfer:
      type: object
      required: [transfer_id, generation, active, status]
      properties:
        transfer_id: { $ref: '#/components/schemas/TransferID' }
        generation: { type: integer, format: int64, minimum: 1 }
        active: { type: boolean }
        status: { type: string, enum: [waiting, received] }
        received_at: { type: string, format: date-time }
    Directory:
      type: object
      required: [id, label]
      properties:
        id: { $ref: '#/components/schemas/DirectoryID' }
        label: { type: string, description: 设备选定的显示名称。不超过 120 UTF-8 字节。 }
        device_id: { $ref: '#/components/schemas/DeviceID' }
    Binding:
      type: object
      required: [id, device_id, directory_id, agent_kind, is_default]
      properties:
        id: { type: string, format: uuid }
        device_id: { $ref: '#/components/schemas/DeviceID' }
        directory_id: { $ref: '#/components/schemas/DirectoryID' }
        directory_label: { type: string }
        agent_kind: { $ref: '#/components/schemas/AgentKind' }
        is_default: { type: boolean }
    ProjectBinding:
      type: object
      required: [name]
      anyOf:
        - required: [device_id, directory_id]
        - required: [bindings]
      properties:
        name: { type: string, description: 不超过 120 UTF-8 字节 }
        device_id: { $ref: '#/components/schemas/DeviceID' }
        directory_id: { $ref: '#/components/schemas/DirectoryID' }
        agent_kind: { $ref: '#/components/schemas/AgentKind' }
        git_policy:
          description: 省略时保留已保存规则，显式 null 时关闭。版本由 Hub 生成。
          oneOf:
            - { $ref: '#/components/schemas/GitDeliveryPolicy' }
            - { type: 'null' }
        bindings:
          type: array
          minItems: 1
          maxItems: 32
          description: 恰有一条默认绑定
          items: { $ref: '#/components/schemas/Binding' }
    GitDeliveryPolicy:
      type: object
      additionalProperties: false
      required: [base_ref, remote, test, max_repairs]
      properties:
        revision: { type: integer, minimum: 0, description: Hub 保存后分配的规则版本。 }
        base_ref: { type: string, description: 完整的 refs/heads/ 本地分支或 refs/remotes/ 远端跟踪引用。 }
        remote: { type: string, description: 设备仓库已配置的 Git 远端别名。 }
        target_branch: { type: string, description: 完整的 refs/heads/ 目标引用。留空使用任务分支。 }
        test:
          type: object
          additionalProperties: false
          required: [program, timeout_seconds]
          properties:
            program: { type: string, description: 设备 PATH 中的测试程序名称。 }
            args: { type: array, items: { type: string }, description: 原样传入的参数列表。 }
            timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
        review_agent: { $ref: '#/components/schemas/AgentKind' }
        max_repairs: { type: integer, minimum: 0, maximum: 5 }
    Project:
      allOf:
        - { $ref: '#/components/schemas/ProjectBinding' }
        - type: object
          required: [id, directory_label]
          properties:
            id: { type: string, format: uuid }
            directory_label: { type: string }
    Message:
      type: object
      required: [id, kind, text, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [user, reply, report, approval] }
        text: { type: string }
        task_id: { $ref: '#/components/schemas/TaskID' }
        status: { type: string, enum: [accepted, handled, interrupted] }
        created_at: { type: string, format: date-time }
    ApprovalID:
      type: string
      pattern: '^approval-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000, description: 原文不超过 2000 UTF-8 字节，不含空字符，去除两端空白后须有内容。 }
        options:
          type: array
          maxItems: 8
          uniqueItems: true
          description: 可在 Web 中直接选择的答复。每项原文不超过 240 UTF-8 字节，不含空字符，去除两端空白后非空且互不重复。
          items: { type: string, minLength: 1, maxLength: 240 }
        impact: { type: string, maxLength: 2000, description: 决定可能影响的下一步。原文不超过 2000 UTF-8 字节，不含空字符。 }
    Approval:
      type: object
      required: [id, task_id, root_task_id, run_id, question, options, status, created_at]
      properties:
        id:
          description: 与主对话里 kind 为 approval 的消息 ID 相同。
          $ref: '#/components/schemas/ApprovalID'
        task_id: { $ref: '#/components/schemas/TaskID' }
        root_task_id: { $ref: '#/components/schemas/TaskID' }
        run_id: { $ref: '#/components/schemas/RunID' }
        question: { type: string }
        options: { type: array, items: { type: string } }
        impact: { type: string }
        status:
          type: string
          enum: [pending, answered, handled, cancelled]
          description: 分别表示待答复、答复已保存、设备已处理和请示已取消。
        answer: { type: string }
        created_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time }
        handled_at: { type: string, format: date-time }
    TaskControlAction:
      type: string
      enum: [pause, stop_current, resume, cancel]
      description: pause 在本轮结束后暂停排程。stop_current 结束当前进程树并暂停任务。resume 恢复排程。cancel 取消任务及其未结束的子任务。
    TaskState: { type: string, enum: [queued, running, waiting_dependencies, waiting_delivery, waiting_reply, pausing, stopping, cancelling, completed, failed, interrupted, paused, cancelled] }
    Task:
      type: object
      required: [id, project_id, project_name, device_id, directory_id, status, title, report_pending, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TaskID' }
        project_id:
          description: 组合根任务为空字符串。
          oneOf: [{ type: string, format: uuid, minLength: 1 }, { const: '' }]
        project_name: { type: string }
        device_id:
          description: 组合根任务为空字符串。
          oneOf: [{ $ref: '#/components/schemas/DeviceID' }, { const: '' }]
        directory_id:
          description: 组合根任务为空字符串。
          oneOf: [{ $ref: '#/components/schemas/DirectoryID' }, { const: '' }]
        parent_task_id: { $ref: '#/components/schemas/TaskID' }
        root_task_id: { $ref: '#/components/schemas/TaskID' }
        binding_id: { type: string, format: uuid }
        agent_kind:
          description: 组合根任务为空字符串。
          oneOf: [{ $ref: '#/components/schemas/AgentKind' }, { const: '' }]
        center_group: { type: boolean, description: 为 true 时由中心汇总子任务状态，设备运行记录在各子任务上。 }
        depends_on_task_ids:
          type: array
          uniqueItems: true
          description: 中心计划定义的直接前置任务 ID 列表。
          items: { $ref: '#/components/schemas/TaskID' }
        waiting_reason: { type: string, enum: [children, delivery, transfers, prerequisites] }
        current_run_generation: { type: integer, format: int64, minimum: 0, description: 组合根任务为 0。 }
        git_policy_revision: { type: integer, format: int64, minimum: 1, description: 托管 Git 任务冻结的规则版本 }
        git_publish: { type: boolean, description: 任务要求确认远端目标包含候选提交。 }
        wait_generation: { type: integer, format: int64, minimum: 1 }
        status: { $ref: '#/components/schemas/TaskState' }
        control_actions:
          type: array
          uniqueItems: true
          description: 当前任务状态允许的控制操作。字段缺省表示暂无可用操作。
          items: { $ref: '#/components/schemas/TaskControlAction' }
        title: { type: string }
        result: { type: string }
        report_pending: { type: boolean }
        updated_at: { type: string, format: date-time }
    RunDiagnosticCount:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    DeviceUsage:
      type: object
      required: [projects, devices]
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/DeviceUsageGroup' } }
        devices: { type: array, items: { $ref: '#/components/schemas/DeviceUsageGroup' } }
        center: { $ref: '#/components/schemas/DeviceUsageGroup' }
    DeviceUsageGroup:
      type: object
      required: [id, name, finished_runs, measured_runs, sources]
      properties:
        id: { type: string, description: 项目 ID、执行设备 ID 或固定值 center }
        name: { type: string, description: 项目、设备或中心 dsh 的显示名 }
        finished_runs: { type: integer, format: int64, minimum: 1, description: 已领取且已结束的设备运行数或已完成的中心投递数 }
        measured_runs: { type: integer, format: int64, minimum: 0, description: 其中有可确认用量的轮数 }
        sources: { type: array, items: { $ref: '#/components/schemas/DeviceUsageSource' } }
    DeviceUsageSource:
      type: object
      description: 保留各 CLI 的统计口径。Token 合计以十进制字符串表示，可选合计仅在对应样本数大于零时返回。
      required: [source, measured_runs, input_tokens, output_tokens, cached_input_runs, cache_write_input_runs, reasoning_output_runs, total_runs]
      properties:
        source: { type: string, enum: [dsh_headless, codex_exec, dsh_center_turn] }
        measured_runs: { type: integer, format: int64, minimum: 1 }
        input_tokens: { $ref: '#/components/schemas/TokenSum' }
        output_tokens: { $ref: '#/components/schemas/TokenSum' }
        cached_input_tokens: { $ref: '#/components/schemas/TokenSum' }
        cached_input_runs: { type: integer, format: int64, minimum: 0 }
        cache_write_input_tokens: { $ref: '#/components/schemas/TokenSum' }
        cache_write_input_runs: { type: integer, format: int64, minimum: 0 }
        reasoning_output_tokens: { $ref: '#/components/schemas/TokenSum' }
        reasoning_output_runs: { type: integer, format: int64, minimum: 0 }
        total_tokens: { $ref: '#/components/schemas/TokenSum' }
        total_runs: { type: integer, format: int64, minimum: 0 }
    TokenSum:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    RunUsage:
      type: object
      required: [source, input_tokens, output_tokens]
      properties:
        source: { type: string, enum: [dsh_headless, codex_exec] }
        input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        output_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        cached_input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        cache_write_input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        reasoning_output_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        total_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
    RunDiagnostics:
      type: object
      additionalProperties: false
      description: 设备上报的本轮诊断摘要。缺省计数表示未知，零表示已测得零。
      properties:
        stdout_bytes: { $ref: '#/components/schemas/RunDiagnosticCount' }
        stderr_bytes: { $ref: '#/components/schemas/RunDiagnosticCount' }
        exit_code: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        capture_incomplete: { type: boolean, description: 设备未能完整保存输出流。 }
        error_kind: { type: string, enum: [native_exit, interrupted, output, setup] }
        usage: { $ref: '#/components/schemas/RunUsage' }
        reviews:
          type: array
          maxItems: 6
          description: 按返修序号递增，每个候选最多一次。缺失表示旧记录没有独立审查诊断。
          items: { $ref: '#/components/schemas/ReviewDiagnostics' }
    ReviewDiagnostics:
      type: object
      additionalProperties: false
      required: [candidate_oid, repair_index, agent_kind, status]
      properties:
        candidate_oid: { type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' }
        repair_index: { type: integer, minimum: 0, maximum: 5, description: 从零开始，对应返修次数 }
        agent_kind: { $ref: '#/components/schemas/AgentKind' }
        status: { type: string, enum: [passed, changes_requested, unverified] }
        diagnostics: { $ref: '#/components/schemas/ReviewRunDiagnostics' }
        log_invocation: { $ref: '#/components/schemas/ReviewLogInvocation' }
    ReviewRunDiagnostics:
      type: object
      additionalProperties: false
      description: 单次独立审查调用采集的诊断，不包含主修复轮次与其他审查。
      properties:
        stdout_bytes: { $ref: '#/components/schemas/RunDiagnosticCount' }
        stderr_bytes: { $ref: '#/components/schemas/RunDiagnosticCount' }
        exit_code: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        capture_incomplete: { type: boolean }
        error_kind: { type: string, enum: [native_exit, interrupted, output, setup] }
        usage: { $ref: '#/components/schemas/RunUsage' }
    CenterTurnUsage:
      type: object
      description: 已完成的中心 dsh 原生轮次用量。只随 handled 回执提交。输入计数不含缓存读写。
      required: [source, input_tokens, output_tokens, total_tokens]
      properties:
        source: { type: string, enum: [dsh_center_turn] }
        input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        output_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        cached_input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        cache_write_input_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        reasoning_output_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
        total_tokens: { $ref: '#/components/schemas/RunDiagnosticCount' }
    RunLogRequestID:
      type: string
      pattern: '^log-[0-9a-f]{32}$'
    ReviewLogInvocation:
      type: string
      pattern: '^review-[0-9]{1,10}$'
    RunLogRunID:
      type: string
      pattern: '^run-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    RunLogRequest:
      type: object
      additionalProperties: false
      required: [id, run_id]
      properties:
        id: { $ref: '#/components/schemas/RunLogRequestID' }
        run_id: { $ref: '#/components/schemas/RunLogRunID' }
        invocation: { $ref: '#/components/schemas/ReviewLogInvocation' }
    RunLogResponse:
      type: object
      additionalProperties: false
      required: [status]
      description: available 附带 1 至 8 个文件，missing 和 failed 不附带文件。同一调用及输出流只能出现一次。
      properties:
        status: { type: string, enum: [available, missing, failed] }
        files:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [invocation, stream, text, truncated]
            properties:
              invocation: { type: string, pattern: '^(?:cli-[0-9]{1,10}|review-[0-9]{1,10})$' }
              stream: { type: string, enum: [stdout, stderr] }
              text: { type: string, description: 日志文件末尾的 UTF-8 文本。所有文件正文合计不超过 64 KiB。 }
              truncated: { type: boolean }
              updated_at: { type: string, format: date-time, description: 设备打开文件时读取的修改时间 }
    GitVerification:
      type: object
      additionalProperties: false
      description: 设备上报的候选测试回执。通过须有候选提交、测试退出码 0 和本机日志引用。
      required: [test_status]
      properties:
        base_oid: { $ref: '#/components/schemas/GitCommitOID' }
        candidate_oid: { $ref: '#/components/schemas/GitCommitOID' }
        test_exit_code: { type: integer, format: int64, minimum: 0, maximum: 4294967295 }
        test_log_ref: { type: string, pattern: '^test-[0-9]+/output\.log$', description: 相对于设备任务目录的日志引用 }
        test_status: { type: string, enum: [passed, failed, unverified] }
        review_agent: { $ref: '#/components/schemas/AgentKind' }
        review_status: { type: string, enum: [passed, changes_requested, unverified] }
        repair_attempts: { type: integer, minimum: 0, maximum: 5 }
    GitCommitOID: { type: string, pattern: '^(?:[a-f0-9]{40}|[a-f0-9]{64})$' }
    GitPushIntentID: { type: string, pattern: '^push-[0-9a-f-]{36}$' }
    GitPublication:
      type: object
      required: [id, revision, remote, target_ref, candidate_oid, status]
      properties:
        id: { $ref: '#/components/schemas/GitPushIntentID' }
        revision: { type: integer, format: int64, minimum: 1 }
        remote: { type: string, description: 设备仓库的远端别名。 }
        target_ref: { type: string, description: 完整的 refs/heads 分支引用。 }
        candidate_oid: { $ref: '#/components/schemas/GitCommitOID' }
        status: { type: string, enum: [pending, same_commit, contains_commit, missing, diverged, unavailable] }
        observed_oid: { $ref: '#/components/schemas/GitCommitOID' }
    GitPushIntent:
      allOf:
        - $ref: '#/components/schemas/GitPublication'
        - type: object
          required: [destination_fingerprint, push_allowed]
          properties:
            destination_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
            push_allowed: { type: boolean }
    Run:
      type: object
      required: [id, task_id, directory_id, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/RunID' }
        task_id: { $ref: '#/components/schemas/TaskID' }
        directory_id: { $ref: '#/components/schemas/DirectoryID' }
        status: { type: string, enum: [queued, running, waiting, waiting_delivery, approval_requested, stopped, completed, failed, interrupted, paused, cancelled] }
        session_id: { type: string }
        generation: { type: integer, format: int64, minimum: 1 }
        lease_until: { type: string, format: date-time }
        diagnostics: { $ref: '#/components/schemas/RunDiagnostics' }
        git_verification: { $ref: '#/components/schemas/GitVerification' }
        git_publication: { $ref: '#/components/schemas/GitPublication' }
        text: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskDetail:
      type: object
      required: [task, runs, messages, approvals]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        runs: { type: array, items: { $ref: '#/components/schemas/Run' } }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        children: { type: array, items: { $ref: '#/components/schemas/Task' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        transfers: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
        inputs: { type: array, items: { $ref: '#/components/schemas/TaskInput' } }
        waited_transfers: { type: array, items: { $ref: '#/components/schemas/WaitedTransfer' } }
    Workspace:
      type: object
      required: [cursor, messages, tasks, projects, directories, approvals]
      properties:
        cursor: { type: integer, format: int64 }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
        directories: { type: array, items: { $ref: '#/components/schemas/Directory' } }
    Delivery:
      type: object
      required: [id, lease, kind, text, attempt]
      properties:
        id: { type: string }
        lease: { $ref: '#/components/schemas/Lease' }
        kind: { type: string, enum: [message, report] }
        text: { type: string }
        message_id: { type: string, format: uuid }
        task_id: { $ref: '#/components/schemas/TaskID' }
        project_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        usage_supported: { type: boolean, description: 为 true 时完成回执可携带中心轮次用量。 }
        plan_supported: { type: boolean, description: 为 true 时当前 Hub 接受带 steps 的中心组合派发。 }
    DeviceID:
      type: string
      pattern: '^d-[0-9a-f]{32}$'
    DeviceName:
      type: string
      minLength: 1
      maxLength: 128
      description: 非空白，且不含控制字符
    PlatformPart:
      type: string
      pattern: '^[a-z0-9]{1,32}$'
    PairingCode:
      type: string
      pattern: '^[A-Za-z0-9_-]{24}$'
    Agents:
      type: array
      maxItems: 2
      description: 每个 Agent ID 最多出现一次
      items:
        $ref: '#/components/schemas/Agent'
    Agent:
      type: object
      additionalProperties: false
      required: [id, version, status, capabilities]
      properties:
        id: { type: string, enum: [codex, dsh] }
        version:
          type: string
          maxLength: 64
          description: 规范化版本。未识别时为空字符串。
        status:
          type: string
          enum: [supported, missing, unsupported, probe_failed]
          description: supported 表示识别到输入、最终回复和会话续接能力
        capabilities:
          type: object
          additionalProperties: false
          required: [prompt, final_reply, resume]
          properties:
            prompt: { type: boolean }
            final_reply: { type: boolean }
            resume: { type: boolean }
    Device:
      type: object
      required: [id, name, hostname, os, arch, registered_at, last_seen_at, probed_at, revoked_at, online, agents]
      properties:
        id: { $ref: '#/components/schemas/DeviceID' }
        name: { $ref: '#/components/schemas/DeviceName' }
        hostname: { $ref: '#/components/schemas/DeviceName' }
        os: { $ref: '#/components/schemas/PlatformPart' }
        arch: { $ref: '#/components/schemas/PlatformPart' }
        registered_at: { type: string, format: date-time }
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: 最近一次心跳的 Hub 记录时间
        probed_at:
          type: [string, 'null']
          format: date-time
          description: 最近一次清单上报的 Hub 记录时间
        revoked_at: { type: [string, 'null'], format: date-time }
        online:
          type: boolean
          description: 设备尚未撤销且最近一次心跳距当前少于 90 秒
        agents: { $ref: '#/components/schemas/Agents' }
